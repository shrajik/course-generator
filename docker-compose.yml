services:
  postgres:
    # pgvector/pgvector:pg16 is upstream Postgres 16 with the pgvector
    # extension precompiled in - a drop-in replacement for postgres:16-alpine
    # (same data format, same named volume below), needed for the semantic
    # memory feature's `CREATE EXTENSION vector` migration to succeed here.
    # NOTE: switching a *running* container's image requires recreating it
    # (`docker compose up -d --force-recreate postgres`) - your data in the
    # `postgres_data` volume is preserved, but the container restarts
    # briefly. Do this at a time of your choosing; until then this service
    # keeps running on its previous image and the app keeps working on
    # keyword-only retrieval (semantic retrieval fails soft without pgvector).
    image: pgvector/pgvector:pg16
    container_name: course_creator_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_generator}
      POSTGRES_USER: ${POSTGRES_USER:-course_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A separate, disposable database for the pytest suite's DB-backed tests -
  # never point destructive test fixtures (Base.metadata.drop_all) at the
  # `postgres` service above, which holds real course data. No named volume:
  # this is meant to be thrown away and recreated freely.
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: course_creator_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-course_generator_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-course_app_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-course_app_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test

  # Runs untrusted, AI-generated and user-edited code. Everything here is about
  # containing that:
  #  * its own image - no application code, no database driver;
  #  * NO env_file and NO secrets: nothing from .env is passed in;
  #  * attached only to the internal `sandbox` network, so it has no route to
  #    the internet (and, via app/firewall.py, executed code cannot even reach
  #    the backend that shares the network);
  #  * no published ports - only the backend can call it;
  #  * every capability dropped except the few the service needs to demote
  #    each run to an unprivileged uid and to install the firewall rule;
  #  * read-only root filesystem, with a size-bounded tmpfs for scratch space.
  code-executor:
    build:
      context: ./code-executor
      dockerfile: Dockerfile
    container_name: course_creator_code_executor
    # A tiny init as PID 1 that reaps orphaned processes. Without it, every
    # program that forks and gets killed leaves a zombie, zombies count
    # against the runner uid's process limit, and after enough of them every
    # later execution fails to start.
    init: true
    networks:
      - sandbox
    read_only: true
    tmpfs:
      # exec is required: compiled languages (C++) run the binary they just
      # built. nosuid/nodev keep that from becoming a privilege path.
      - /work:size=256m,mode=0755,exec,nosuid,nodev
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN   # install the iptables rule that silences executed code
      - SETUID      # drop each execution to the runner uid
      - SETGID
      - CHOWN       # hand the per-run workspace to that uid
      - DAC_OVERRIDE  # root must clean up files the runner uid created
      - FOWNER
      - KILL        # kill a runaway process group owned by another uid
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course_creator_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://course_app:course_app_dev@postgres:5432/course_generator}
    volumes:
      # Generated courses, research, documents, images and PDFs stay on the host
      # so you can inspect them without entering the container.
      - ./backend/data:/app/data
      # Comment out for a production-like image; handy while iterating.
      - ./backend/app:/app/app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - default
      - sandbox

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Every request is made from the browser, so this must be the URL the
        # user's machine can reach - not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: course_creator_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

networks:
  # internal: true means containers on it have no route out of the Docker
  # host. The backend is the only service that shares it with the executor.
  sandbox:
    internal: true

volumes:
  postgres_data:
