# Production stack for a single Docker host (Contabo VPS), deployed by deploy/deploy.py
# (also what .github/workflows/deploy.yml runs).
#
# Differences from docker-compose.yml (the development file):
#   * no --reload, no source bind-mount: the backend runs the code baked into its image;
#   * NO service publishes a host port by default. The frontend and backend join the external
#     `web` network, where a reverse proxy that is already running on the host (for example a
#     shared Caddy) reaches them as coursegen-frontend:3000 and coursegen-backend:8000.
#     The host's rule: every service stays on CPU cores 4-7 (the other app on this host uses 0-3).
#     Postgres is reachable only inside Docker. If the host has no proxy yet, enable the bundled
#     one with the `own-caddy` profile (`deploy.py --with-caddy`); it needs ports 80/443 free;
#   * database migrations run before the API starts (the app does not run them itself);
#   * secrets have no defaults: the stack refuses to start if one is missing;
#   * the throw-away test database is gone.
#
# Required environment (the server's .env, see .env.production.example):
#   APP_DOMAIN, API_DOMAIN, POSTGRES_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, plus AI provider keys.

name: coursegen

services:
  caddy:
    image: caddy:2
    # Only started with `--profile own-caddy`: the host's ports 80/443 are usually taken by an
    # existing proxy, and starting a second one would fail (or worse, fight the first).
    profiles: ["own-caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys: losing this volume means re-issuing them.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    cpuset: "4-7"
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_generator}
      POSTGRES_USER: ${POSTGRES_USER:-course_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs untrusted, AI-generated and user-edited code - same hardening as the dev file
  # (no secrets, internal-only network, dropped capabilities, read-only root, size limits).
  code-executor:
    build:
      context: ./code-executor
      dockerfile: Dockerfile
    init: true
    cpuset: "4-7"
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /work:size=256m,mode=0755,exec,nosuid,nodev
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    cpuset: "4-7"
    mem_limit: 6g
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-course_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-course_generator}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      # Derived from the two domains so they cannot drift apart. The browser address must match
      # FRONTEND_ORIGIN exactly (CORS allows exactly this one origin).
      FRONTEND_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}
    volumes:
      # Generated courses, uploads, images and PDFs. Back this volume up.
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      code-executor:
        condition: service_healthy
    # Migrations first, then exactly ONE worker: generation jobs and their live progress are
    # held in this process's memory, so a second worker would not see the first one's jobs.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    networks:
      default:
      sandbox:
      web:
        aliases: [coursegen-backend]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at BUILD time: changing API_DOMAIN means a rebuild
        # (the deploy workflow always rebuilds).
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN must be set}
    cpuset: "4-7"
    mem_limit: 1g
    environment:
      # Docker sets HOSTNAME to the container id and Next.js binds to that single address, i.e. only
      # the internal network. Listen on every interface so the proxy can reach it over `web`.
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    networks:
      default:
      web:
        aliases: [coursegen-frontend]
    restart: unless-stopped

networks:
  # Containers on it have no route out of the host; only the backend shares it with the executor.
  sandbox:
    internal: true
  # Shared with the host's reverse proxy. deploy.py creates it if missing
  # (`docker network create web`).
  web:
    external: true

volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:
